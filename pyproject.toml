[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kolay-cli"
version = "0.8.1"
description = "Command-line interface for Kolay IK (https://apidocs.kolayik.com)"
authors = [
    {name = "Tunc Aucer"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "requests>=2.31.0",
    "rich>=13.4.2",
    "PyYAML>=6.0",
    "fastmcp>=3.1.0",
]
license = "MIT"
keywords = ["kolay", "hr", "cli", "kolayik", "human-resources"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/ezapmar/kolay-cli"
Repository = "https://github.com/ezapmar/kolay-cli"
Issues = "https://github.com/ezapmar/kolay-cli/issues"

[project.scripts]
kolay = "kolay_cli.cli:app"
kolay-mcp = "kolay_cli.mcp_server:mcp.run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
test = ["pytest>=7.0", "pytest-mock>=3.10"]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "types-requests",
    "types-PyYAML",
    "pre-commit"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "B", "I", "N", "UP", "ANN", "S", "PT", "ARG", "PTH", "RET"]
ignore = ["ANN101", "ANN102", "ANN204"] # Self, cls, and __init__ annotations

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

