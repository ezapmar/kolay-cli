name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # Provide a dummy token so auth-dependent CLI commands don't fail in CI.
      # Replace with a real token secret for integration tests.
      KOLAY_API_TOKEN: "ci-test-token"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: |
          pytest tests/ -q

      - name: Verify CLI loads
        run: |
          kolay --help
          kolay --version

      - name: Verify subcommands
        run: |
          kolay auth --help
          kolay person --help
          kolay leave --help
