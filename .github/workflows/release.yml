name: Build and Release Standalone Wizard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: kolay-setup-linux
          - os: macos-latest
            asset_name: kolay-setup-macos
          - os: windows-latest
            asset_name: kolay-setup-windows.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build with PyInstaller
        run: python build.py

      - name: Rename executable (unix)
        if: runner.os != 'Windows'
        run: mv dist/kolay-setup dist/${{ matrix.asset_name }}

      - name: Rename executable (windows)
        if: runner.os == 'Windows'
        run: mv dist/kolay-setup.exe dist/${{ matrix.asset_name }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten folder structure
        run: |
          mkdir -p dist
          find release-assets -type f -exec cp {} dist/ \;

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
